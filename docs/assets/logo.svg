<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="go-yjs-relay">
  <defs>
    <linearGradient id="relay" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0EA5E9"/>
      <stop offset="1" stop-color="#075985"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#relay)"/>
  <!-- Y-shaped relay: a central hub fans frames out to three peer nodes -->
  <g stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" fill="none">
    <line x1="128" y1="132" x2="66" y2="60"/>
    <line x1="128" y1="132" x2="190" y2="60"/>
    <line x1="128" y1="132" x2="128" y2="208"/>
  </g>
  <circle cx="128" cy="132" r="21" fill="#FFFFFF"/>
  <circle cx="66" cy="60" r="15" fill="#FFFFFF"/>
  <circle cx="190" cy="60" r="15" fill="#FFFFFF"/>
  <circle cx="128" cy="208" r="15" fill="#FFFFFF"/>
</svg>
